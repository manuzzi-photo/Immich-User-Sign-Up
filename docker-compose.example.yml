#
# Complete example: full Immich stack + the Immich Sign-Up webapp.
#
# This is the official Immich docker-compose with the `immich-signup` service
# added at the end. The sign-up service uses the prebuilt image from GHCR, so no
# local build is required. Copy `.env.example` values into your `.env` (the same
# one Immich uses) and start everything with:
#
#   docker compose -f docker-compose.example.yml up -d
#
# Then generate an admin API key inside Immich (Account Settings -> API Keys)
# and put it in IMMICH_SIGNUP_API_KEY before the sign-up webapp can create users.
#
# Immich images are pinned to v2.7.5, the version this webapp is verified
# against. Override with IMMICH_VERSION in .env to use a different release (the
# webapp will warn at startup if the running Immich differs).
# Reference compose: https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml

name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v2.7.5}
    # extends:
    #   file: hwaccel.transcoding.yml
    #   service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    volumes:
      # Do not edit the next line. If you want to change the media storage location on your system, edit the value of UPLOAD_LOCATION in the .env file
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - '2283:2283'
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    # For hardware acceleration, add one of -[armnn, cuda, rocm, openvino, rknn] to the image tag.
    # Example tag: ${IMMICH_VERSION:-v2.7.5}-cuda
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v2.7.5}
    # extends: # uncomment this section for hardware acceleration - see https://docs.immich.app/features/ml-hardware-acceleration
    #   file: hwaccel.ml.yml
    #   service: cpu # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference - use the `-wsl` version for WSL2 where applicable
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:3eeb09785cd61ec8e3be35f8804c8892080f3ca21934d628abc24ee4ed1698f6
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Uncomment the DB_STORAGE_TYPE: 'HDD' var if your database isn't stored on SSDs
      # DB_STORAGE_TYPE: 'HDD'
    volumes:
      # Do not edit the next line. If you want to change the database storage location on your system, edit the value of DB_DATA_LOCATION in the .env file
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false

  # ---------------------------------------------------------------------------
  # Self sign-up webapp (invite codes + manual admin approval).
  # Exposed on port 2284; talks to immich-server over the internal network.
  # ---------------------------------------------------------------------------
  immich-signup:
    container_name: immich_signup
    image: ghcr.io/manuzzi-photo/immich-user-sign-up:0.0.3
    # To build from source instead of pulling, comment out `image:` above and
    # uncomment the block below, then start with `--build`:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    environment:
      # Immich server reachable on the shared Docker network.
      IMMICH_API_URL: ${IMMICH_API_URL:-http://immich-server:2283}
      # Admin API key generated in Immich (Account Settings -> API Keys).
      IMMICH_API_KEY: ${IMMICH_SIGNUP_API_KEY}
      # Default per-user disk quota in bytes (5 GiB).
      DEFAULT_QUOTA_BYTES: ${DEFAULT_QUOTA_BYTES:-5368709120}
      # Random secret: openssl rand -hex 32
      SESSION_SECRET: ${SIGNUP_SESSION_SECRET}
      # Optional public Immich URL shown after a successful sign-up.
      IMMICH_PUBLIC_URL: ${IMMICH_PUBLIC_URL:-}
      # Set to 1 when served over HTTPS.
      COOKIE_SECURE: ${SIGNUP_COOKIE_SECURE:-0}
      # Existing-user SSO (optional): true requires a shared parent domain.
      SSO_ENABLED: ${SSO_ENABLED:-false}
      IMMICH_COOKIE_DOMAIN: ${IMMICH_COOKIE_DOMAIN:-}
      NODE_ENV: production
    ports:
      - '2284:2284'
    volumes:
      - signup-data:/app/server/data
    depends_on:
      - immich-server
    restart: always

volumes:
  model-cache:
  signup-data:
